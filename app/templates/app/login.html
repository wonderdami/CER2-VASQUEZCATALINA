{% extends 'app/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">
                    <h2 class="text-center fw-bold text-success mb-4">Iniciar Sesión</h2>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {{ form.as_p }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg shadow-sm">Ingresar</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <small class="text-muted">Área exclusiva para la gestión interna del refugio.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
